name: CI Pipeline

# This workflow runs on every push and pull request
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Environment variables available to all jobs
env:
  DOTNET_VERSION: '8.0.x'
  DOCKER_BUILDKIT: 1

jobs:
  # Job 1: Restore dependencies and build the solution
  build:
    name: Build Solution
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore MicroservicesStarter.sln
      
    - name: Build solution
      run: dotnet build MicroservicesStarter.sln --no-restore --configuration Release
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: '**/bin/Release/**'
        retention-days: 1

  # Job 2: Run unit tests (if you have test projects)
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore MicroservicesStarter.sln
      
    - name: Build solution
      run: dotnet build MicroservicesStarter.sln --no-restore --configuration Release
      
    - name: Run tests
      run: dotnet test MicroservicesStarter.sln --no-build --configuration Release --verbosity normal
      continue-on-error: true  # Continue even if tests fail (for now, until you add tests)
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/TestResults/**'
        retention-days: 7

  # Job 3: Lint and code quality checks
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Install .NET format tool
      run: dotnet tool install -g dotnet-format || true
      
    - name: Check code formatting
      run: dotnet format --verify-no-changes --verbosity diagnostic
      continue-on-error: true
      
    - name: Run code analysis (if analyzers are configured)
      run: dotnet build MicroservicesStarter.sln --configuration Release --no-restore
      continue-on-error: true

  # Job 4: Build Docker images (without pushing)
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build, test]
    
    strategy:
      matrix:
        service:
          - name: identityservice
            dockerfile: src/services/IdentityService/Dockerfile
          - name: productservice
            dockerfile: src/services/ProductService/Dockerfile
          - name: orderservice
            dockerfile: src/services/OrderService/Dockerfile
          - name: apigateway
            dockerfile: src/gateway/ApiGateway/Dockerfile
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image for ${{ matrix.service.name }}
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.service.dockerfile }}
        push: false
        tags: microservicesstarter/${{ matrix.service.name }}:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true  # Load image into local Docker daemon for testing
        
    - name: Test Docker image
      run: |
        docker images | grep ${{ matrix.service.name }}
        echo "Docker image built successfully: ${{ matrix.service.name }}"

  # Job 5: Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Summary job that runs after all jobs complete
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build, test, lint, docker-build, security]
    if: always()
    
    steps:
    - name: CI Pipeline Status
      run: |
        echo "✅ CI Pipeline completed!"
        echo "Build: ${{ needs.build.result }}"
        echo "Tests: ${{ needs.test.result }}"
        echo "Lint: ${{ needs.lint.result }}"
        echo "Docker Build: ${{ needs.docker-build.result }}"
        echo "Security: ${{ needs.security.result }}"

