name: Docker Build (Individual Service)

# This workflow builds a single service when its files change
on:
  push:
    paths:
      - 'src/services/IdentityService/**'
      - 'src/gateway/ApiGateway/**'
      - 'src/services/ProductService/**'
      - 'src/services/OrderService/**'
      - 'src/shared/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build.yml'

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1

jobs:
  # Detect which services changed
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      identityservice: ${{ steps.filter.outputs.identityservice }}
      productservice: ${{ steps.filter.outputs.productservice }}
      orderservice: ${{ steps.filter.outputs.orderservice }}
      apigateway: ${{ steps.filter.outputs.apigateway }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Detect changed services
      uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          identityservice:
            - 'src/services/IdentityService/**'
            - 'src/shared/**'
          productservice:
            - 'src/services/ProductService/**'
            - 'src/shared/**'
          orderservice:
            - 'src/services/OrderService/**'
            - 'src/shared/**'
          apigateway:
            - 'src/gateway/ApiGateway/**'
            - 'src/shared/**'

  # Build changed services
  build-service:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.${{ matrix.service.name }} == 'true'
    
    strategy:
      matrix:
        service:
          - name: identityservice
            dockerfile: src/services/IdentityService/Dockerfile
          - name: productservice
            dockerfile: src/services/ProductService/Dockerfile
          - name: orderservice
            dockerfile: src/services/OrderService/Dockerfile
          - name: apigateway
            dockerfile: src/gateway/ApiGateway/Dockerfile
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.name }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.service.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

